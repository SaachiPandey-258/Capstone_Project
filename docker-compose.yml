services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGINS: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OSM_USER_AGENT: ${OSM_USER_AGENT:-MorrowResearchPortal/1.0}
      OSM_CONTACT_EMAIL: ${OSM_CONTACT_EMAIL:-}
      MODEL_ARTIFACTS_DIR: /app/models
    volumes:
      - portal-data:/app/backend/.data
      - portal-uploads:/app/backend/uploads
      - ./models:/app/models:ro
  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  portal-data:
  portal-uploads:
